<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Maré Mansa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&display=swap">
<style>
/* Layout: pixel-art harbour stage with HUD plaques floating over it (stacked on phones); the dock opens a full panel */
:root {
  --night: #0a1330;
  --night-2: #111b40;
  --night-3: #1a2550;
  --panel: rgba(16, 24, 54, 0.92);
  --gold: #c9a464;
  --gold-dim: #6f5a3a;
  --ink: #eef0f7;
  --muted: #9ba7c9;
  --ember: #f29a3a;
  --sea: #5ec8ec;
  --ok: #6fd08c;
  --warn: #f2c14a;
  --bad: #f2665a;
  --sol: #b58cff;
  --f-display: "Pixelify Sans", "Courier New", monospace;
  --f-label: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--f-display);
  font-size: 17px;
  font-variant-ligatures: none;   /* a ligadura "fi" da Pixelify sai quebrada */
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.masthead { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; }
.masthead h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); font-weight: 600; letter-spacing: 0.02em; text-wrap: balance; }
.masthead p { margin: 0; color: var(--muted); font-size: 18px; }
.demo-tag { font-family: var(--f-label); font-size: 12px; letter-spacing: .08em; color: var(--warn); border: 1px solid var(--gold-dim); padding: 3px 7px; }

.panel {
  background: var(--panel);
  border: 2px solid var(--gold);
  box-shadow: inset 0 0 0 2px #0c1228, 0 3px 0 rgba(0,0,0,0.35);
  clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
}
.label { font-family: var(--f-label); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.value { font-size: 21px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.px { image-rendering: pixelated; display: block; flex: none; }

.game { display: grid; gap: 10px; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 10; max-width: 100%; background: #0b1d38; overflow: hidden; }
#cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: default; }
#cv.hot { cursor: pointer; }
.dock-btn { position: absolute; right: 7%; top: 27%; font-family: var(--f-label); font-size: 15px; letter-spacing: .08em; color: var(--ink); background: rgba(10,19,48,.85); border: 2px solid var(--gold); padding: 8px 12px; cursor: pointer; animation: bob 2.2s ease-in-out infinite; }
.dock-btn:hover { background: var(--night-3); }
@keyframes bob { 50% { transform: translateY(-3px); } }

.hud-top { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 16px; padding: 8px 16px; }
.hud-top .stat { display: flex; align-items: center; gap: 7px; }
.hud-top .sep { width: 2px; height: 18px; background: var(--gold-dim); }
.speed { display: flex; gap: 2px; align-items: center; }
.speed button, .ghost { font-family: var(--f-label); font-size: 13px; letter-spacing: 0.06em; background: none; color: var(--muted); border: 1px solid var(--gold-dim); padding: 6px 9px; cursor: pointer; }
.speed button[aria-pressed="true"] { color: #1b1206; background: var(--gold); border-color: var(--gold); }
.speed button:hover, .ghost:hover { color: var(--ink); border-color: var(--gold); }
.wallet { font-family: var(--f-label); font-size: 13px; letter-spacing: .06em; color: var(--ink); background: #2a1f4f; border: 1px solid var(--sol); padding: 5px 9px; cursor: pointer; }
.wallet.on { background: none; color: var(--sol); }

.hud-bottom { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 0; padding: 10px 14px; }
.cell { display: flex; align-items: center; gap: 10px; padding: 0 14px; min-width: 0; }
.cell + .cell { border-left: 2px solid var(--gold-dim); }
.cell .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cell.timer { flex: 1 1 170px; }
.cell.timer .txt { width: 100%; }
.clock { display: flex; align-items: center; gap: 6px; }
.bar { height: 6px; background: #0c1228; border: 1px solid var(--gold-dim); }
.bar > i { display: block; height: 100%; width: 0; background: var(--ember); }
.bar.sea > i { background: var(--sea); }
.act { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.navs { display: flex; gap: 4px; }

.btn {
  font-family: var(--f-display); font-size: 19px; font-weight: 600;
  color: #1b1206; background: var(--ember); border: 0; padding: 10px 16px; cursor: pointer; white-space: nowrap;
  box-shadow: inset 0 -3px 0 #b5641c, inset 0 2px 0 #ffc27a;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:active:not(:disabled) { box-shadow: inset 0 3px 0 #b5641c; }
.btn:disabled { background: #3a3f5c; color: var(--muted); box-shadow: none; cursor: default; }
.btn.alt { background: #2b3a70; color: var(--ink); box-shadow: inset 0 -3px 0 #1a2550, inset 0 2px 0 #44579a; }
.btn.sol { background: var(--sol); color: #1b1030; box-shadow: inset 0 -3px 0 #7a55c9, inset 0 2px 0 #d8c4ff; }
.btn.sm { font-size: 17px; padding: 7px 11px; }
.card .btn, .banner .btn { white-space: normal; max-width: 100%; text-align: left; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }

.coin { width: 12px; height: 12px; background: #f2a83a; box-shadow: inset -2px -2px 0 #b0702a, inset 1px 1px 0 #ffd77a; flex: none; display: inline-block; }
.solc { width: 12px; height: 12px; background: linear-gradient(180deg, #7de3c3 0 33%, #b58cff 33% 66%, #6aa0ff 66%); flex: none; display: inline-block; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(4, 8, 22, 0.72); display: flex; align-items: flex-start; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 16px max(12px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
button, select { font-variant-ligatures: none; }
.sheet.panel { background: #10183a; }
.sheet { width: min(1040px, 100%); display: flex; flex-direction: column; gap: 0; margin-block: auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 16px 10px; }
.sheet-head h2 { margin: 0; font-size: 32px; font-weight: 600; }
.bal { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.bal span { font-size: 19px; display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 2px solid var(--gold-dim); flex-wrap: wrap; }
.tabs button { font-family: var(--f-label); font-size: 16px; letter-spacing: .08em; background: none; color: var(--muted); border: 2px solid transparent; border-bottom: 0; padding: 12px 18px; cursor: pointer; margin-bottom: -2px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--gold-dim); background: var(--night-2); border-bottom: 2px solid var(--night-2); }
.tab-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 300px; }
.close { font-family: var(--f-label); font-size: 14px; background: none; color: var(--ink); border: 1px solid var(--gold-dim); padding: 6px 10px; cursor: pointer; }
.intro { color: #cdd4ea; font-size: 19px; line-height: 1.45; margin: 0; max-width: 72ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.grid.items { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card { background: var(--night-2); border: 1px solid #26336a; padding: 12px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.card.locked { border-style: dashed; align-items: flex-start; justify-content: center; }
.card h3 { margin: 0; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.chip { font-family: var(--f-label); font-size: 13px; letter-spacing: .06em; padding: 3px 6px; border: 1px solid currentColor; white-space: nowrap; }
.rar { font-family: var(--f-label); font-size: 13px; letter-spacing: .06em; padding: 3px 6px; color: #0a1330; background: var(--rc); white-space: nowrap; }
.eq { display: grid; grid-template-columns: 46px 1fr; gap: 4px 8px; align-items: center; }
.eq img { width: 46px; height: auto; image-rendering: pixelated; }
.eq select { width: 100%; min-width: 0; font-family: var(--f-display); font-size: 17px; background: #0c1228; color: var(--ink); border: 1px solid var(--gold-dim); padding: 6px; }
.eq .meta { grid-column: 2; display: flex; gap: 6px; align-items: center; font-family: var(--f-label); font-size: 13px; color: var(--muted); letter-spacing: .04em; flex-wrap: wrap; }
.mini { width: 60px; height: 6px; background: #0c1228; display: inline-block; vertical-align: middle; }
.mini > i { display: block; height: 100%; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row.sp { justify-content: space-between; }
.small { font-size: 17px; color: var(--muted); line-height: 1.4; margin: 0; }
.small b { color: var(--ink); font-weight: 400; }
.it-top { display: flex; gap: 10px; align-items: center; }
.it-top img { width: 60px; height: auto; image-rendering: pixelated; flex: none; }
.it-name { font-size: 20px; display: block; }
.stats { font-family: var(--f-label); font-size: 13px; letter-spacing: .04em; color: var(--muted); line-height: 1.6; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.filters button { font-family: var(--f-label); font-size: 13px; letter-spacing: .06em; background: none; color: var(--muted); border: 1px solid var(--gold-dim); padding: 7px 10px; cursor: pointer; }
.filters button[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); background: var(--night-3); }
.mint-card { align-items: stretch; }
.mint-card .art { height: 84px; display: grid; place-items: center; background: #0c1228; }
.mint-card .art img { width: 96px; height: auto; image-rendering: pixelated; }
.odds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.odds span { font-family: var(--f-label); font-size: 13px; text-align: center; padding: 4px 0; color: #0a1330; background: var(--rc); }
.reveal { display: flex; gap: 14px; align-items: center; padding: 14px; border: 2px solid var(--rc); background: radial-gradient(circle at 20% 50%, color-mix(in srgb, var(--rc) 22%, transparent), transparent 60%), var(--night-2); }
.reveal img { width: 90px; height: auto; image-rendering: pixelated; }
.reveal.pop { animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(.92); opacity: .2; } 100% { transform: none; opacity: 1; } }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-family: var(--f-label); font-size: 13px; letter-spacing: .06em; color: var(--muted); text-align: left; font-weight: 400; padding: 6px 8px; border-bottom: 1px solid var(--gold-dim); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid #1f2a58; font-size: 18px; white-space: nowrap; }
td img { width: 38px; height: auto; image-rendering: pixelated; vertical-align: middle; }
td.num, th.num { text-align: right; }
.tag { font-family: var(--f-label); font-size: 13px; padding: 3px 6px; }
.tag.hot { color: #1b1206; background: var(--ember); }
.tag.up { color: #1b1206; background: var(--warn); }
.tag.dn { color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: linear-gradient(90deg, rgba(242,154,58,.18), transparent); border-left: 3px solid var(--ember); }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.big { font-size: 34px; font-variant-numeric: tabular-nums; }
.warn-t { color: var(--warn); }
.bad-t { color: var(--bad); }
.ok-t { color: var(--ok); }

.toasts { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; max-width: min(420px, calc(100vw - 24px)); }
.toast { background: var(--panel); border: 2px solid var(--gold); padding: 10px 14px; font-size: 17px; line-height: 1.35; display: flex; gap: 8px; align-items: center; animation: tin .25s ease-out; }
.toast img { width: 36px; height: auto; image-rendering: pixelated; flex: none; }
.toast.rare { border-color: var(--ember); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
.foot { color: var(--muted); font-size: 16px; margin: 0; line-height: 1.5; max-width: 90ch; }

.cell .value { overflow: hidden; text-overflow: ellipsis; max-width: 15ch; }
@media (min-width: 1150px) {
  .game { position: relative; display: block; }
  .hud-bottom .value { font-size: clamp(16px, 1.6vw, 21px); }
  .hud-top { position: absolute; top: 2.2%; left: 50%; transform: translateX(-50%); z-index: 2; flex-wrap: nowrap; }
  .hud-bottom { position: absolute; bottom: 2.6%; left: 50%; transform: translateX(-50%); width: min(90%, 940px); z-index: 2; flex-wrap: nowrap; }
}
@media (max-width: 560px) {
  .cell { padding: 0 10px; }
  .cell.timer { flex-basis: 100%; border-left: 0 !important; }
  .value { font-size: 18px; }
  .dock-btn { font-size: 14px; padding: 8px 12px; right: 3%; top: 20%; }
  .tabs button { font-size: 13px; padding: 10px 11px; }
  .tab-body { padding: 12px; }
}
.sec { margin: 8px 0 0; font-size: 26px; font-weight: 600; display: flex; align-items: baseline; gap: 10px; }
.btn.big { font-size: 24px; padding: 14px 18px; justify-content: center; letter-spacing: .02em; }
/* caixas do mint */
.boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.box { position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 28%, color-mix(in srgb, var(--bc) 38%, transparent), transparent 62%), var(--night-2); border: 2px solid var(--bc); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.box .chest { height: 170px; display: grid; place-items: center; position: relative; isolation: isolate; }
.box .chest::before { content: ""; position: absolute; inset: -60%; z-index: -1; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--bc) 45%, transparent) 0deg 7deg, transparent 7deg 20deg); -webkit-mask: radial-gradient(circle, #000 0, transparent 42%); mask: radial-gradient(circle, #000 0, transparent 42%); animation: spin 16s linear infinite; opacity: .5; }
.box .chest img { width: 170px; image-rendering: pixelated; animation: float 2.4s ease-in-out infinite; filter: drop-shadow(0 8px 0 rgba(0,0,0,.35)) drop-shadow(0 0 16px var(--bc)); }
.box:hover .chest img { animation: float 2.4s ease-in-out infinite, wiggle .5s ease-in-out infinite; }
.box::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.10), transparent); transform: skewX(-18deg); animation: glint 3.6s ease-in-out infinite; pointer-events: none; }
.box h3 { font-size: 26px; }
.box details summary { cursor: pointer; font-family: var(--f-label); font-size: 13px; letter-spacing: .06em; color: var(--muted); }
.box details table td { padding: 4px 6px; font-size: 16px; }
@keyframes float { 50% { transform: translateY(-9px); } }
@keyframes wiggle { 25% { rotate: -4deg; } 75% { rotate: 4deg; } }
@keyframes spin { to { transform: rotate(1turn); } }
@keyframes glint { 0%, 55% { left: -60%; } 100% { left: 130%; } }
.recent { display: flex; gap: 8px; flex-wrap: wrap; }
.recent .it { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--night-2); border: 1px solid var(--rc); }
.recent img { width: 40px; image-rendering: pixelated; }

/* abertura da caixa */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gacha { position: fixed; inset: 0; z-index: 90; display: grid; place-items: safe center; overflow-x: hidden; overflow-y: auto; --rc: #9AA0A6; --ray: .15; --glow: 8;
  background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--rc) 32%, #050914) 0, #050914 72%); }
.gacha #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.g-rays { position: absolute; left: 50%; top: 45%; width: 260vmax; height: 260vmax; translate: -50% -50%; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 65%, transparent) 0deg 5deg, transparent 5deg 15deg); -webkit-mask: radial-gradient(circle, #000 0, transparent 40%); mask: radial-gradient(circle, #000 0, transparent 40%); opacity: var(--ray); animation: spin 9s linear infinite; transition: opacity .35s; }
.g-rays.b { animation-direction: reverse; animation-duration: 14s; opacity: calc(var(--ray) * .6); }
.g-stage { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 16px; max-width: 100%; }
.g-crate img { width: min(280px, 62vw); image-rendering: pixelated; display: block; filter: drop-shadow(0 0 calc(var(--glow) * 1px) var(--rc)) drop-shadow(0 0 calc(var(--glow) * 2.5px) var(--rc)); transition: filter .25s; }
.g-crate.s1 img { animation: shake .14s linear infinite; }
.g-crate.s2 img { animation: shakeHard .06s linear infinite; }
.g-crate.done img { width: min(160px, 40vw); opacity: .55; transition: width .4s, opacity .4s; }
@keyframes shake { 25% { transform: translate(-3px, 1px) rotate(-2deg); } 50% { transform: translate(2px, -2px) rotate(1.5deg); } 75% { transform: translate(-1px, 2px) rotate(-1deg); } }
@keyframes shakeHard { 25% { transform: translate(-7px, 3px) rotate(-5deg) scale(1.04); } 50% { transform: translate(6px, -4px) rotate(4deg) scale(1.06); } 75% { transform: translate(-4px, 5px) rotate(-3deg) scale(1.05); } }
.gacha.quake .g-stage { animation: shakeHard .07s linear 8; }
.g-flash { position: absolute; inset: 0; z-index: 4; background: #fff; opacity: 0; pointer-events: none; }
.g-flash.on { animation: flash .8s ease-out; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
.g-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.g-item img { width: min(300px, 66vw); max-height: 34vh; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 0 16px var(--rc)) drop-shadow(0 0 40px var(--rc)); animation: popIn .75s cubic-bezier(.2, 1.7, .4, 1), float 2.2s ease-in-out .75s infinite; }
@keyframes popIn { 0% { transform: scale(.1) rotate(-30deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.g-rar { font-family: var(--f-label); font-size: clamp(38px, 8vw, 76px); line-height: 1; color: var(--rc); letter-spacing: .06em; text-shadow: 0 0 14px var(--rc), 0 0 42px var(--rc), 0 5px 0 #000; animation: slam .55s cubic-bezier(.2, 1.9, .4, 1); }
.gacha.r4 .g-rar { animation: slam .55s cubic-bezier(.2, 1.9, .4, 1), hue 1.2s linear infinite; }
@keyframes hue { 50% { color: #ffe28c; text-shadow: 0 0 22px #ffe28c, 0 0 60px #ff9800, 0 5px 0 #000; } }
@keyframes slam { 0% { transform: scale(3.2); opacity: 0; } 100% { transform: none; opacity: 1; } }
.g-name { font-size: clamp(24px, 4vw, 34px); }
.g-stats { font-family: var(--f-label); font-size: 16px; color: #dfe4f5; letter-spacing: .04em; }
.g-hint { font-family: var(--f-label); font-size: 15px; letter-spacing: .12em; color: #dfe4f5; animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.g-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.g-skip { position: absolute; z-index: 5; top: max(16px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); font-family: var(--f-label); font-size: 13px; color: var(--ink); background: rgba(0,0,0,.35); border: 1px solid var(--gold-dim); padding: 8px 12px; cursor: pointer; }
.g-count { position: absolute; z-index: 5; top: max(16px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); font-family: var(--f-label); font-size: 13px; color: var(--muted); }
@media (max-width: 560px) { .g-actions .btn.big { font-size: 19px; padding: 11px 14px; } .g-stage { gap: 10px; } }
@media (prefers-reduced-motion: reduce) { .g-flash.on, .dock-btn, .reveal.pop, .toast, .box .chest img, .box::after, .box .chest::before, .g-rays, .g-crate img, .g-item img, .g-rar, .gacha.quake .g-stage, .g-hint { animation: none !important; } }
/* visão 3D */
#cv3 { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: grab; touch-action: none; }
#cv3.hot { cursor: pointer; }
#cv3.drag { cursor: grabbing; }
.stage.v3 .dock-btn { right: auto; translate: -50% -100%; z-index: 2; font-size: 13px; padding: 6px 10px; }

<script>
(() => {
/* ================= utilidades ================= */
const W = 400, H = 250, HZ = 112, SURF = 123;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const R = mulberry32(20261023);
const rr = (a, b) => a + R() * (b - a);
const mr = (a, b) => a + Math.random() * (b - a);
const px = (g, x, y, c) => { g.fillStyle = c; g.fillRect(x, y, 1, 1); };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function disc(g, cx, cy, r, clipY = 1e9) {
  for (let dy = -r; dy <= r; dy++) {
    if (cy + dy >= clipY) continue;
    const hw = Math.floor(Math.sqrt(r * r - dy * dy) + 0.3);
    g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1);
  }
}
function flip(c) { const f = mk(c.width, c.height), g = f.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return f; }
const nf = (v, d = 0) => Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmtClock(sec) { sec = Math.max(0, Math.ceil(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60; return [h, m, s].map(v => String(v).padStart(2, '0')).join(':'); }

/* ================= economia (spec validada por simulação de 30 dias) ================= */
const RARITIES = [
  { id: 'comum', nome: 'Comum', odd: 0.50, cor: '#9AA0A6', M: 1.0 },
  { id: 'incomum', nome: 'Incomum', odd: 0.28, cor: '#4CAF50', M: 1.4 },
  { id: 'raro', nome: 'Raro', odd: 0.15, cor: '#2196F3', M: 1.9 },
  { id: 'epico', nome: 'Épico', odd: 0.06, cor: '#A335EE', M: 2.6 },
  { id: 'lendario', nome: 'Lendário', odd: 0.01, cor: '#FF9800', M: 3.5 },
];
const PITY = 30;                                   // 30 mints do mesmo tipo sem Épico+ → próximo é Épico
const BOAT_STATS = { cap: [[16, 24], [26, 34], [38, 50], [56, 72], [80, 100]], wear: [0.50, 0.42, 0.35, 0.30, 0.26] };        // t; % casco por t
const FISHER_STATS = { rate: [[0.8, 1.2], [1.3, 1.7], [1.9, 2.5], [2.8, 3.6], [4.0, 5.0]], scurvy: [0.80, 0.70, 0.60, 0.52, 0.45] }; // t/h; % saúde por h no mar
const ROD_STATS = { chance: [[0.020, 0.024], [0.023, 0.027], [0.026, 0.030], [0.029, 0.033], [0.032, 0.036]], wear: [0.60, 0.50, 0.42, 0.36, 0.30] }; // por t; % por t
const TRAVEL = 0.5;                                // h de ida e de volta, sem pesca
const MIN_TO_SAIL = 20;
const fHealth = h => h >= 50 ? 1 : 0.4 + 0.6 * h / 50;
const fHull = c => c >= 30 ? 1 : 0.75;
const fRod = v => v >= 50 ? 1 : v / 50;
const MINT_PRICE = { boat: 1300, fisher: 1100, rod: 800 };
const FUSION_FEE = [200, 500, 1200, 3000];
const SLOT_PRICES = [0, 1500, 3000];                 // por enquanto, no máximo 3 vagas
const STORAGE = { base: 30, step: 10, price: 500, max: 100 };
const REPAIR = { boat: 1.4, fisher: 0.9, rod: 1.0 };
const TON_PRICE = 5;
const RARE_FISH = [
  { id: 'camarao', nome: 'Camarão-rosa', peso: 300, preco: 15 },
  { id: 'sardinha', nome: 'Sardinha-dourada', peso: 220, preco: 20 },
  { id: 'lagosta', nome: 'Lagosta', peso: 150, preco: 30 },
  { id: 'polvo', nome: 'Polvo', peso: 110, preco: 45 },
  { id: 'garoupa', nome: 'Garoupa', peso: 80, preco: 60 },
  { id: 'espada', nome: 'Peixe-espada', peso: 55, preco: 90 },
  { id: 'atum', nome: 'Atum-azul', peso: 40, preco: 130 },
  { id: 'manta', nome: 'Arraia-manta', peso: 25, preco: 200 },
  { id: 'martelo', nome: 'Tubarão-martelo', peso: 15, preco: 350 },
  { id: 'baleia', nome: 'Baleia-jubarte', peso: 5, preco: 900 },
];
const PASS = { days: 30, precoRef: [0.028, 0.043, 0.066, 0.108, 0.167] }; // SOL, pelo conjunto médio da vaga
const START = { pesca: 3500, sol: 0.5 };
const PESCA_PER_SOL = 50000;                       // câmbio demo fixo
const SPEEDS = [1, 60, 600];
const OFFLINE_CAP_H = 24 * 7;
const FREE_FISHER = { name: 'Seu Sardinha', rate: 0.4 }; // grátis: pesca no trapiche sem barco, sem desgaste e sem raros; rende cerca de metade de um conjunto comum pago
const TYPE_NAME = { boat: 'Barco', fisher: 'Pescador', rod: 'Vara' };
const BOAT_NAMES = ['Maré Mansa', 'Gaivota', 'Albatroz', 'Estrela do Mar', 'Brisa Leve', 'Netuno', 'Sereia', 'Boto Rosa', 'Jangada Azul', 'Onda Brava', 'Pérola', 'Leviatã', 'Iemanjá', 'Corvina'];
const FISHER_NAMES = ['Nico', 'Dona Rosa', 'Capitão Bento', 'Iara', 'Zé Linha', 'Tonho', 'Marina', 'Seu Jorge', 'Cida', 'Juca', 'Lia', 'Bira', 'Dandara', 'Caetano'];
const ROD_NAMES = ['Vara de bambu', 'Vara de fibra', 'Vara de carbono', 'Vara de titânio', 'Vara de coral'];

/* ================= estado e relógio ================= */
const SAVE_KEY = 'mare-mansa-web3-v1';
function freshState() {
  const g = Date.now() / 1000 - new Date().getTimezoneOffset() * 60;
  return {
    v: 1, pesca: START.pesca, sol: START.sol, wallet: null,
    clock: { g, r: Date.now(), speed: 1 }, lastGame: g,
    items: [], nextId: 1001, pity: { boat: 0, fisher: 0, rod: 0 },
    slots: [newSlot(true)], tons: 0, store: {}, storeCap: STORAGE.base,
    stats: { burned: 0, treasury: 0, tons: 0, rares: 0, earned: 0, spentMaint: 0 },
    lastMints: [], sel: 0,
  };
}
function newSlot(open) { return { open, boat: null, fisher: null, rod: null, state: 'docked', t: 0, tons: 0, rares: [], tripId: null, passUntil: 0, last: null, reason: null }; }
let S;
try { S = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { S = null; }
if (!S || S.v !== 1) S = freshState();
function fitSlots() {
  // saves antigos tinham até 6 vagas: devolve o valor pago e a carga das extras, e solta os itens no inventário
  const OLD = [0, 1500, 3000, 6000, 10000, 15000];
  while (S.slots.length > SLOT_PRICES.length) {
    const k = S.slots.length - 1, sl = S.slots.pop();
    if (sl.open) {
      S.pesca += OLD[k] || 0; S.tons += sl.tons || 0;
      for (const fi of sl.rares || []) S.store[fi] = (S.store[fi] || 0) + 1;
    }
  }
  while (S.slots.length < SLOT_PRICES.length) S.slots.push(newSlot(false));
}
fitSlots();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
const gameNow = () => S.clock.g + (Date.now() - S.clock.r) / 1000 * S.clock.speed;
function setSpeed(sp) { tick(); S.clock.g = gameNow(); S.clock.r = Date.now(); S.clock.speed = sp; persist(); paintSpeed(); bump(); }
const toReal = gameSec => gameSec / S.clock.speed;
const item = id => S.items.find(i => i.id === id) || null;
const slotOf = id => S.slots.findIndex(s => s.boat === id || s.fisher === id || s.rod === id);

/* ================= market / promoção ================= */
const promoCache = {};
function rawPick(day) { return Math.floor(mulberry32(hashStr('pesca-raw-' + day))() * 10); }
// destaque nunca repete o de ontem: cadeia determinística a partir de um dia âncora fixo, com cache
const PROMO_ANCHOR = 20000, destCache = {};
function destOf(day) {
  if (day <= PROMO_ANCHOR) return rawPick(day);
  if (destCache[day] !== undefined) return destCache[day];
  let d = day - 1;
  while (d > PROMO_ANCHOR && destCache[d] === undefined) d--;
  let prev = d <= PROMO_ANCHOR ? rawPick(d) : destCache[d];
  for (let k = d + 1; k <= day; k++) {
    let v = rawPick(k);
    if (v === prev) v = (v + 1 + Math.floor(mulberry32(hashStr('pesca-shift-' + k))() * 9)) % 10;
    destCache[k] = prev = v;
  }
  return destCache[day];
}
function promo(day) {
  if (promoCache[day]) return promoCache[day];
  const g = mulberry32(hashStr('pesca-' + day));
  const dest = destOf(day);
  let alta; do { alta = Math.floor(g() * 10); } while (alta === dest);
  const feira = ((day % 7) + 7) % 7 === 3;          // dia 3 da época Unix = domingo
  const mult = RARE_FISH.map(() => 0.85 + g() * 0.25);
  mult[dest] = 1.5 + g() * 0.5;
  mult[alta] = feira ? 1.5 + g() * 0.5 : 1.25;
  const ton = TON_PRICE * (0.9 + g() * 0.2);
  return (promoCache[day] = { dest, alta, feira, mult, ton });
}
const today = () => promo(Math.floor(gameNow() / 86400));
const rarePrice = (i, p = today()) => Math.round(RARE_FISH[i].preco * p.mult[i]);
function pickRare(u) { let x = u * 1000; for (let i = 0; i < RARE_FISH.length; i++) { x -= RARE_FISH[i].peso; if (x < 0) return i; } return 0; }
const storeCount = () => Object.values(S.store).reduce((a, b) => a + b, 0);

/* ================= itens / mint ================= */
const uni = (a, u) => a[0] + u * (a[1] - a[0]);
function rollRarity(type) {
  const p = S.pity[type] || 0;                   // mints seguidos sem Épico+
  let x = Math.random(), r = 0;
  for (; r < RARITIES.length - 1; r++) { x -= RARITIES[r].odd; if (x < 0) break; }
  if (p >= PITY && r < 3) r = 3;                 // depois de 30 sem Épico, o próximo é Épico
  S.pity[type] = r >= 3 ? 0 : p + 1;
  return r;
}
const pityLeft = type => PITY + 1 - (S.pity[type] || 0);
function makeItem(type, rar) {
  const u = Math.random(), id = S.nextId++;
  const it = { id, type, rar, cond: 100 };
  if (type === 'boat') { it.cap = Math.round(uni(BOAT_STATS.cap[rar], u)); it.name = BOAT_NAMES[Math.floor(Math.random() * BOAT_NAMES.length)]; }
  if (type === 'fisher') { it.rate = Math.round(uni(FISHER_STATS.rate[rar], u) * 100) / 100; it.name = FISHER_NAMES[Math.floor(Math.random() * FISHER_NAMES.length)]; it.skin = Math.floor(Math.random() * 4); }
  if (type === 'rod') { it.chance = Math.round(uni(ROD_STATS.chance[rar], u) * 10000) / 10000; it.name = ROD_NAMES[rar]; }
  return it;
}
function spend(amount) { if (S.pesca < amount) return false; S.pesca -= amount; return true; }
function burnSplit(amount, burnPct) { S.stats.burned += amount * burnPct; S.stats.treasury += amount * (1 - burnPct); }
// tipos que o jogador ainda não tem nenhum: sem eles não existe primeiro conjunto
const missingTypes = () => ['boat', 'fisher', 'rod'].filter(t => !S.items.some(i => i.type === t));
function mintBlock(type) {
  const miss = missingTypes();
  if (!miss.length || miss.includes(type)) return null;
  const need = miss.reduce((a, t) => a + MINT_PRICE[t], 0);
  if (S.pesca - MINT_PRICE[type] < need) return `Guarde ${nf(need)} PESCA para ${miss.map(t => TYPE_NAME[t].toLowerCase()).join(' e ')}: sem isso você não monta o primeiro conjunto.`;
  return null;
}
function mint(type, batch) {
  if (!S.wallet) { toast('Conecte a carteira para fazer mint.'); return null; }
  const block = batch ? null : mintBlock(type);
  if (block) { toast(block); return null; }
  const price = MINT_PRICE[type];
  if (!spend(price)) { toast('PESCA insuficiente para esse mint.'); return null; }
  burnSplit(price, 0.7);
  const it = makeItem(type, rollRarity(type));
  S.items.push(it);
  if (!batch) S.lastMints = [it.id];
  autoEquip(it);
  persist(); bump(true);
  return it;
}
function autoEquip(it) {
  const i = S.slots.findIndex(s => s.open && s.state === 'docked' && !s[it.type]);
  if (i >= 0) S.slots[i][it.type] = it.id;
}
function itemStats(it) {
  if (it.type === 'boat') return `Carga ${it.cap} t · Casco ${Math.floor(it.cond)}%`;
  if (it.type === 'fisher') return `${nf(it.rate, 2)} t/h · Saúde ${Math.floor(it.cond)}%`;
  return `Raro ${nf(it.chance * 100, 2)}%/t · Vara ${Math.floor(it.cond)}%`;
}
const condName = { boat: 'Casco', fisher: 'Saúde', rod: 'Vara' };
const repairCost = it => Math.ceil((100 - it.cond) * REPAIR[it.type] * RARITIES[it.rar].M);
const canService = it => { const s = slotOf(it.id); return s < 0 || S.slots[s].state === 'docked'; };
function repair(it) {
  if (!it || it.cond >= 100 || !canService(it)) return false;
  const c = repairCost(it);
  if (!spend(c)) { toast('PESCA insuficiente para os mantimentos.'); return false; }
  S.stats.spentMaint += c; burnSplit(c, 1);
  it.cond = 100; return true;
}
function fuse(type, rar) {
  const pool = S.items.filter(i => i.type === type && i.rar === rar && slotOf(i.id) < 0).sort((a, b) => statOf(a) - statOf(b)).slice(0, 3);
  if (pool.length < 3 || rar >= 4) return;
  const fee = FUSION_FEE[rar];
  if (!spend(fee)) { toast('PESCA insuficiente para a fusão.'); return; }
  burnSplit(fee, 1);
  S.items = S.items.filter(i => !pool.includes(i));
  const it = makeItem(type, rar + 1);
  S.items.push(it); S.lastMints = [it.id];
  persist(); bump(true);
  revealItems([it], { fusion: true });
}
const statOf = it => it.type === 'boat' ? it.cap : it.type === 'fisher' ? it.rate : it.chance;

/* ================= simulação das viagens ================= */
const slotItems = sl => ({ b: item(sl.boat), f: item(sl.fisher), r: item(sl.rod) });
const passOn = (sl, now) => sl.passUntil > now;
function effRate(b, f) { return f.rate * fHealth(f.cond) * fHull(b.cond); }
function canSail(sl) {
  const { b, f, r } = slotItems(sl);
  if (!sl.open || sl.state !== 'docked') return 'O barco não está atracado.';
  if (!b || !f || !r) return 'Equipe barco, pescador e vara.';
  if (b.cond < MIN_TO_SAIL) return `Casco abaixo de ${MIN_TO_SAIL}%. Conserte antes de zarpar.`;
  if (f.cond < MIN_TO_SAIL) return `Pescador com escorbuto. Dê mantimentos antes de zarpar.`;
  return null;
}
function sail(i) {
  const sl = S.slots[i], why = canSail(sl);
  if (why) { toast(why); return false; }
  departFx(i);
  sl.state = 'going'; sl.t = 0; sl.tons = 0; sl.rolled = 0; sl.rares = []; sl.reason = null;
  sl.tripId = `${S.wallet || 'anon'}-${i}-${Math.floor(gameNow())}-${S.nextId}`;
  return true;
}
function recall(i) {
  const sl = S.slots[i];
  if (sl.state !== 'fishing' && sl.state !== 'going') return;

    if (GA.skip || reduce) { el.textContent = fmt(goal) + tail; return res(); }
    const t0 = performance.now(), dur = 700;
    const step = now => {
      const q = Math.min(1, (now - t0) / dur), e2 = 1 - Math.pow(1 - q, 3);
      el.textContent = fmt(goal * e2) + (q >= 1 ? tail : '');
      if (Math.random() < 0.5 && q < 1) beep(900 + q * 600, 0.02, 'square', 0.015);
      if (q < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}

// preço do passe = 1,25 × manutenção esperada em 30 dias de cada peça (80% do tempo no mar) ÷ câmbio demo
function passPrice(sl) {
  const { b, f, r } = slotItems(sl);
  if (!b || !f || !r) return null;
  const tonsDay = 24 * b.cap / (b.cap / f.rate + 2 * TRAVEL);
  const perDay = tonsDay * BOAT_STATS.wear[b.rar] * REPAIR.boat * RARITIES[b.rar].M
    + tonsDay * ROD_STATS.wear[r.rar] * REPAIR.rod * RARITIES[r.rar].M
    + 24 * FISHER_STATS.scurvy[f.rar] * REPAIR.fisher * RARITIES[f.rar].M;
  return Math.round(1.25 * perDay * 0.8 * PASS.days / 50000 * 1000) / 1000;
}
function slotRefillCost(sl) { const { b, f, r } = slotItems(sl); return [b, f, r].filter(Boolean).reduce((a, it) => a + repairCost(it), 0); }

function init3D() {

      p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.k === 'bub') { p.x += Math.sin(T3 * 3 + k) * dt * 0.3; if (p.y > -0.2) { p.life = 0; if (Math.random() < 0.3) puff('foam', p.x, 0.1, p.z, 0, 0.6, 0, 0.5, 0.2, 2); } }
      if (p.k === 'foam' && p.y < -0.2 && p.vy < 0) p.life = Math.min(p.life, 0.05);
      if (p.life <= 0) P.splice(k, 1);
    }
    for (let k = 0; k < P.length; k++) {
      const p = P[k], a = clamp(p.life / p.max, 0, 1), s = p.k === 'smoke' ? p.s * (1 + (1 - a) * 1.6) : p.k === 'bub' ? p.s : p.s * Math.sqrt(a);
      obj.position.set(p.x, p.y, p.z); obj.rotation.set(0, 0, 0); obj.scale.set(s, s, s); obj.updateMatrix(); pim.setMatrixAt(k, obj.matrix); pim.setColorAt(k, p.col);
    }
    pim.count = P.length; pim.instanceMatrix.needsUpdate = true; if (pim.instanceColor) pim.instanceColor.needsUpdate = true;
  }
  const vProj = new THREE.Vector3();
  function placeLabel(el, x, y, z, avoid) {
    vProj.set(x, y, z).project(camera);
    const off = vProj.z > 1 || Math.abs(vProj.x) > 1.05 || Math.abs(vProj.y) > 1.05;
    let L = (vProj.x + 1) / 2 * cv3.clientWidth, T = (1 - vProj.y) / 2 * cv3.clientHeight;
    // não deixa uma etiqueta cobrir a outra
    if (avoid) { const h = el.offsetHeight + 4, w = (el.offsetWidth + avoid.w) / 2 + 4; if (Math.abs(L - avoid.l) < w && Math.abs(T - avoid.t) < h) T = avoid.t - h; }
    el.style.visibility = off ? 'hidden' : '';
    el.style.left = L.toFixed(0) + 'px'; el.style.top = T.toFixed(0) + 'px';
    return { l: L, t: T, w: el.offsetWidth };
  }
  V3.render = dt => {
    resize3();
    if (!size.w) return;
    T3 += dt;
    const night = updateSky();
    updateCamera(dt);
    updateWorld(dt, night);
    updateBoats(dt, night);
    updateJumpers(dt);
    if (hoverEv && !ptrs.size) { const u = rayHit(hoverEv); cv3.classList.toggle('hot', !!u); hoverEv = null; }
    post.uniforms.time.value = T3; post.uniforms.cn.value = camera.near; post.uniforms.cf.value = camera.far;
    post.uniforms.hz.value.set(cam.dist * 0.95, cam.dist * 1.7);
    renderer.shadowMap.needsUpdate = true;
    camera.layers.enableAll();
    renderer.setRenderTarget(rtMain); renderer.setClearColor(0x000000, 1); renderer.render(scene, camera);
    camera.layers.set(0); scene.overrideMaterial = normMat;
    renderer.setRenderTarget(rtNorm); renderer.setClearColor(0x808080, 1); renderer.render(scene, camera);
    scene.overrideMaterial = null;
    renderer.setRenderTarget(null); renderer.render(postScene, postCam);
    const dl = placeLabel($('dockBtn'), -3.5, DECK + 5, -21);
    placeLabel($('marketBtn'), MX, 10.5, MZ, dl);
  };
  V3.onRare = (i, fi) => rareFx(i, fi);
  V3.onDepart = i => { const bs = B3[i]; if (!bs) return; bs.depart = 2.6; splash(bs.x, bs.z, 18, 0.35); };
  V3.reset = () => { B3.forEach(bs => { bs.init = false; }); };
  resize3();
}

/* ================= início ================= */
paintSpeed();
{
  const away = (gameNow() - S.lastGame) / 3600;
  offlineLog = { rares: [], back: [], free: 0 };
  tick();
  const L = offlineLog; offlineLog = null;
  if (away > 0.05) {
    const parts2 = [];
    if (L.free >= 0.05) parts2.push(`${FREE_FISHER.name} pescou ${nf(L.free, 1)} t`);
    if (L.back.length) parts2.push(`${L.back.length} ${L.back.length === 1 ? 'barco voltou' : 'barcos voltaram'} com ${nf(L.back.reduce((a, [, d]) => a + d.tons, 0), 1)} t`);
    if (L.rares.length) parts2.push(`${L.rares.length} ${L.rares.length === 1 ? 'raro fisgado' : 'raros fisgados'}`);
    if (parts2.length) toast(`Enquanto você estava fora: ${parts2.join(', ')}.`);
  }
  persist();
}
S.slots.forEach((sl, i) => { boatPos[i].x = targetX(i, sl); });
setInterval(() => { tick(); if (UI.open && UI.rev !== REV && !panelBusy()) renderPanel(); else refreshTimers(); updateHud(); }, 250);
setInterval(persist, 3000);
addEventListener('pagehide', persist);
let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (view === '3d' && V3.ready) V3.render(dt); else draw(dt); requestAnimationFrame(frame); }
updateHud(); draw(0);
if (view === '3d') boot3D();
paintView();
requestAnimationFrame(frame);
})();
